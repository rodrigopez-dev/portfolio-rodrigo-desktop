<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfólio criativo apresentado como um desktop interativo." />
  <title>Rodrigo Pezotti — Portfólio</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <main class="desktop" aria-label="Portfólio em formato de desktop">
    <div class="wallpaper" aria-hidden="true"></div>

    <header class="menubar">
      <button class="apple" data-open="sobre" aria-label="Abrir apresentação">R</button>
      <strong>Rodrigo Pezotti</strong>
      <nav aria-label="Menu principal">
        <button data-open="sobre">Sobre</button>
        <button data-open="contato">Contato</button>
        <button id="reset-layout" type="button">Restaurar posições</button>
      </nav>
      <div class="status"><span id="date"></span><span id="clock"></span></div>
    </header>

    <section class="workspace" aria-label="Projetos e widgets arrastáveis">
      <button class="desktop-item p1" data-open="identidade">
        <span class="project-file" aria-hidden="true"><span class="file-kind">PROJETO</span><span class="file-preview">ID</span><span class="file-lines"></span></span><span>Identidade visual</span>
      </button>
      <button class="desktop-item p2" data-open="campanha">
        <span class="project-file" aria-hidden="true"><span class="file-kind">PROJETO</span><span class="file-preview">CD</span><span class="file-lines"></span></span><span>Campanha digital</span>
      </button>
      <button class="desktop-item p3" data-open="editorial">
        <span class="project-file" aria-hidden="true"><span class="file-kind">PROJETO</span><span class="file-preview">ED</span><span class="file-lines"></span></span><span>Projeto editorial</span>
      </button>
      <button class="desktop-item p4" data-open="motion">
        <span class="project-file" aria-hidden="true"><span class="file-kind">PROJETO</span><span class="file-preview">MV</span><span class="file-lines"></span></span><span>Motion & vídeo</span>
      </button>
      <button class="desktop-item p5" data-open="social">
        <span class="project-file" aria-hidden="true"><span class="file-kind">PROJETO</span><span class="file-preview">SM</span><span class="file-lines"></span></span><span>Social media</span>
      </button>
      <button class="desktop-item p6" data-open="web">
        <span class="project-file" aria-hidden="true"><span class="file-kind">PROJETO</span><span class="file-preview">WEB</span><span class="file-lines"></span></span><span>Experiência web</span>
      </button>
      <button class="desktop-item p7" data-open="foto">
        <span class="project-file" aria-hidden="true"><span class="file-kind">PROJETO</span><span class="file-preview">DA</span><span class="file-lines"></span></span><span>Direção de arte</span>
      </button>
      <button class="desktop-item p8" data-open="experimentos">
        <span class="project-file" aria-hidden="true"><span class="file-kind">PROJETO</span><span class="file-preview">LAB</span><span class="file-lines"></span></span><span>Experimentos</span>
      </button>
      <button type="button" class="desktop-widget widget-calendar" data-drag-id="calendar" data-open="calendario" aria-label="Abrir calendário">
        <span class="widget-date-heading"><span id="widget-weekday">Qui.</span><span id="widget-month">nov.</span></span>
        <strong class="widget-day" id="widget-day">26</strong>
      </button>
      <button type="button" class="desktop-widget widget-about" data-drag-id="about" data-open="sobre" aria-label="Abrir apresentação de Rodrigo Pezotti">
        <span class="widget-about-heading"><span class="widget-monogram" aria-hidden="true">R</span><span>PORTFÓLIO</span></span>
        <strong>Rodrigo<br />Pezotti</strong>
        <span class="widget-about-footer">Criação visual</span>
      </button>
      <button type="button" class="desktop-widget widget-archive" data-drag-id="archive" data-open="arquivo" aria-label="Abrir arquivo com oito projetos">
        <span class="widget-archive-heading">ARQUIVO</span>
        <strong>08</strong>
        <span class="widget-archive-footer">projetos para explorar</span>
      </button>
      <button type="button" class="desktop-widget widget-motion" data-drag-id="motion" data-open="motion" aria-label="Abrir projeto Motion e vídeo">
        <span class="widget-motion-heading">EM FOCO</span>
        <span class="widget-motion-symbol" aria-hidden="true">▶</span>
        <strong>Motion &amp;<br />vídeo</strong>
      </button>
      <button type="button" class="desktop-widget widget-feature" data-drag-id="feature" data-open="identidade" aria-label="Abrir projeto Identidade visual">
        <span class="widget-feature-heading">ARQUIVO EM FOCO</span>
        <span class="widget-feature-body"><span class="widget-feature-art" aria-hidden="true"><span>ID</span></span><span class="widget-feature-copy"><strong>Identidade<br />visual</strong><span>Explorar projeto</span></span></span>
      </button>
    </section>

    <section class="window" id="project-window" role="dialog" aria-modal="false" aria-labelledby="window-title" hidden>
      <div class="window-bar">
        <div class="traffic"><button class="close" aria-label="Fechar"></button><i></i><i></i></div>
        <span id="window-label">Projeto</span>
        <button class="window-home" type="button" data-open="arquivo" aria-label="Ver todos os projetos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
      </div>
      <div class="window-shell">
        <aside class="window-sidebar" aria-label="Navegação da janela">
          <span class="sidebar-heading">PORTFÓLIO</span>
          <button type="button" data-open="arquivo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5h7l2 2H21v9H3z"/></svg>Projetos</button>
          <button type="button" data-open="sobre"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-4 3-6 7-6s6.5 2 7 6"/></svg>Sobre</button>
          <button type="button" data-open="contato"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>Contato</button>
        </aside>
        <div class="window-content">
          <p class="eyebrow" id="window-type">Projeto selecionado</p>
          <h1 id="window-title">Título do projeto</h1>
          <p id="window-description">Descrição do projeto.</p>
          <div class="project-meta"><span id="window-year">2026</span><span id="window-skills">Direção criativa</span></div>
          <div class="project-preview" id="window-preview" aria-hidden="true"><span>Capa em preparação</span></div>
          <div class="window-directory" id="window-directory" hidden>
            <button type="button" data-open="identidade">Identidade visual</button>
            <button type="button" data-open="campanha">Campanha digital</button>
            <button type="button" data-open="editorial">Projeto editorial</button>
            <button type="button" data-open="motion">Motion &amp; vídeo</button>
            <button type="button" data-open="social">Social media</button>
            <button type="button" data-open="web">Experiência web</button>
            <button type="button" data-open="foto">Direção de arte</button>
            <button type="button" data-open="experimentos">Experimentos</button>
          </div>
        </div>
      </div>
    </section>

    <nav class="dock" aria-label="Aplicativos">
      <button data-open="motion" aria-label="After Effects"><span class="dock-icon"><img src="assets/aftereffects.svg" alt="" /></span><small>After Effects</small></button>
      <button data-open="foto" aria-label="Photoshop"><span class="dock-icon"><img src="assets/photoshop.svg" alt="" /></span><small>Photoshop</small></button>
      <button data-open="identidade" aria-label="Illustrator"><span class="dock-icon"><img src="assets/illustrator.svg" alt="" /></span><small>Illustrator</small></button>
      <button data-open="apresentacoes" aria-label="PowerPoint"><span class="dock-icon"><img src="assets/powerpoint-appstore.png" alt="" /></span><small>PowerPoint</small></button>
      <span class="dock-separator" role="separator" aria-orientation="vertical"></span>
      <button data-open="notas" aria-label="Bloco de Notas"><span class="dock-icon"><img src="assets/notes-macos26.png" alt="" /></span><small>Notas</small></button>
      <button data-open="fotos" aria-label="Fotos"><span class="dock-icon"><img src="assets/photos-macos26.png" alt="" /></span><small>Fotos</small></button>
      <span class="dock-separator" role="separator" aria-orientation="vertical"></span>
      <a href="#" id="instagram" aria-label="Instagram"><span class="dock-icon"><img src="assets/instagram-appstore.png" alt="" /></span><small>Instagram</small></a>
      <button data-open="contato" aria-label="E-mail"><span class="dock-icon"><img src="assets/mail-macos26.png" alt="" /></span><small>E-mail</small></button>
      <span class="dock-separator" role="separator" aria-orientation="vertical"></span>
      <button data-open="lixeira" aria-label="Lixeira"><span class="dock-icon trash"><img src="assets/trash-glass.png" alt="" /></span><small>Lixeira</small></button>
    </nav>
  </main>
  <script src="app.js?v=8"></script>
</body>
</html>
